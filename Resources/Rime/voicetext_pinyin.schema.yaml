# VoiceText base full-pinyin configuration. Dictionary: upstream rime-luna-pinyin.
schema:
  schema_id: voicetext_pinyin
  name: VoiceText 全拼
  version: '1.0'
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
  - name: simplification
    reset: 1
    states: [繁體, 简体]
  - name: full_shape
    reset: 0
    states: [半角, 全角]
  - name: ascii_punct
    states: [中文标点, 英文标点]
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [simplifier, uniquifier]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
translator:
  dictionary: luna_pinyin
  enable_user_dict: true
  preedit_format:
    - xform/v/ü/
simplifier:
  option_name: simplification
  opencc_config: t2s.json
  tips: none
ascii_composer:
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
key_binder:
  bindings:
    - { when: paging, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
punctuator:
  half_shape:
    ',': { commit: '，' }
    '.': { commit: '。' }
    '?': { commit: '？' }
    '!': { commit: '！' }
    ':': { commit: '：' }
    ';': { commit: '；' }
    '(': '（'
    ')': '）'
    '[': '【'
    ']': '】'
    '"': { pair: ['“', '”'] }
    "'": { pair: ['‘', '’'] }
    '<': '《'
    '>': '》'
    "\\": '、'
recognizer:
  patterns:
    email: '^[A-Za-z][-_.0-9A-Za-z]*@.*$'
    url: '^(https?://|www[.]).*$'
